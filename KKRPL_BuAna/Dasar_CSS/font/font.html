<html>
<head>
    <title>Pengaturan Font</title>
    <style type="text/css">
        p.italic{
                    font-size :200%;
                    font-style: italic;
                }
        p.normal{
                    font-family : verdana;
                    font-style: normal;
                }
        p.oblique{
                    font-style: oblique;
                }
    </style>
</head>
<body>
    <p class="italic">Menggunakan Style Italic</p>
    <p class="normal">Menggunakan Style Normal</p>
    <p class="oblique">Menggunakan Style Oblique</p>
</body>
</html>

<html>
<head>
    <title>Pengaturan Font</title>
    <style type="text/css">
        p.normal{
                    font-family :verdana ;
                    font-weight: normal;
                }
        p.thick{
                    font-family : verdana;
                    font-weight: bold;
                }
        p.thicker{
                    font-family: times;
                    font-weight: 900;
                }
    </style>
</head>
<body>
    <p class="normal">This is a paragraph</p>
    <p class="thick">This is a paragraph</p>
    <p class="thicker">This is a paragraph</p>
</body>
</html>
